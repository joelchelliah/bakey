# Pings Supabase so the free project isn't paused for inactivity.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *' # every 3 days; scheduled runs can be delayed or skipped
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query recipes table
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$URL/rest/v1/recipes?select=id&limit=1" \
            -H "apikey: $KEY"
